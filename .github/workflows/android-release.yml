name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify release source
        run: |
          set -e

          test -f app/src/main/assets/web/index.html
          test -f app/src/main/assets/web/owner-dashboard.html
          test -f app/src/main/assets/web/admin-dashboard.html

          grep -q "showMarketplaceLoading" \
            app/src/main/assets/web/index.html
          grep -q "showCarLoading" \
            app/src/main/assets/web/index.html
          grep -q "loadHomeMarketplace" \
            app/src/main/assets/web/index.html
          grep -q "loadHomeCars" \
            app/src/main/assets/web/index.html

          grep -q "saveCar" \
            app/src/main/assets/web/owner-dashboard.html
          grep -q 'from("cars")' \
            app/src/main/assets/web/owner-dashboard.html
          grep -q "loadCars" \
            app/src/main/assets/web/owner-dashboard.html
          grep -q "saveMarketplaceItem" \
            app/src/main/assets/web/owner-dashboard.html
          grep -q 'from("marketplace_items")' \
            app/src/main/assets/web/owner-dashboard.html
          grep -q "loadMarketplace" \
            app/src/main/assets/web/owner-dashboard.html

          grep -q "loadMarketplaceAdmin" \
            app/src/main/assets/web/admin-dashboard.html
          grep -q "loadCarsAdmin" \
            app/src/main/assets/web/admin-dashboard.html
          grep -q "loadDailyReport" \
            app/src/main/assets/web/admin-dashboard.html
          grep -q 'id="dailyreport"' \
            app/src/main/assets/web/admin-dashboard.html

          echo "FINAL SOURCE CHECK: ALL PASSED"

      - name: Build release APK
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          echo "$KEYSTORE_B64" | base64 --decode > "$HOME/release.jks"

          cat > keystore.properties <<PROPS
          storeFile=$HOME/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

          ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK exists
        run: |
          set -e
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -1)

          "$APKSIGNER" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Generate SHA-256
        run: |
          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            | tee app-release.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EasternEthiopiaDigitalBroker-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.sha256
          if-no-files-found: error
